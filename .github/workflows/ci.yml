name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    uses: storymeedev/infrastructure/.github/workflows/reusable-node-service.yml@master
    with:
      node_version: "22"
      run_tests: false
      dockerfile: Dockerfile
      image_name: core-team-api
      publish_image: ${{ github.event_name == 'push' }}
    secrets: inherit
